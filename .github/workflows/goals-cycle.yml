name: Goal reminders and check-ins

# Sends due reminders and collects Done/Missed taps in a single job.
#
# The schedule is limited to waking hours in UTC rather than running all day,
# because a private repository has a monthly Actions minute allowance and an
# overnight reminder would never be acted on anyway. 12:00-05:00 UTC covers
# roughly 06:00-23:00 in America/Denver across both daylight and standard time.
on:
  schedule:
    - cron: "*/30 12-23,0-5 * * *"
  workflow_dispatch:

# Runs commit state back to the repository, so overlapping runs must be avoided.
concurrency:
  group: goals-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    env:
      # A workspace-local library so the cache path is explicit and stable.
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v4

      - name: Verify credentials are available
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            exit 1
          fi
          echo "Both secrets are present."

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rlib
          key: rlib-${{ runner.os }}-httr2-yaml-v1

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'required <- c("httr2", "yaml"); absent <- required[!required %in% rownames(installed.packages())]; if (length(absent)) install.packages(absent); invisible(lapply(required, library, character.only = TRUE)); cat("R packages ready\n")'

      - name: Run reminder and check-in cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: Rscript R/run_cycle.R

      # Runs even when the cycle failed. A check-in is appended to the log
      # before it is acknowledged, so a later error must not discard data that
      # Telegram will not deliver a second time.
      - name: Commit updated logs
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No log changes to commit."
            exit 0
          fi
          git config user.name "goal-bot"
          git config user.email "goal-bot@users.noreply.github.com"
          git add data
          git commit -m "chore: record reminders and check-ins"
          # A concurrent run may have pushed since checkout, so rebase onto the
          # remote before pushing, and retry once if the race repeats.
          for attempt in 1 2; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed log update on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed."
          done
          exit 1
