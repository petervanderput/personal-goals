# Personal goal definitions.
#
# Field names follow the goal-setting literature rather than generic todo-list
# wording, because the structure is what makes reminders effective:
#   - outcome and per-requirement counts: specific measurable goals beat "do
#     your best" (Locke & Latham's goal-setting theory)
#   - implementation_intention: an if-then cue of when, where and what, the
#     strongest single predictor of follow-through (Gollwitzer & Sheeran 2006)
#   - obstacle and coping_plan: mental contrasting, i.e. the WOOP protocol
#   - block tiers: pre-committed outcomes, with loss framing outperforming an
#     equivalent bonus
#   - intrinsic: when true, no tangible reward is attached, since rewarding
#     already-enjoyable activity erodes intrinsic motivation (Deci et al. 1999)
#
# schedule: quota  counts sessions across the period on any day
# schedule: fixed  anchors a goal to a known day and time (needs remind_at)

timezone: America/Denver

goals:
  - id: boxing
    title: "Get better and more consistent at boxing"
    outcome: "Train four times a week, every week"
    period: week
    schedule: quota
    difficulty: 3
    intrinsic: false

    # Each session type has its own cue, because they happen at different times
    # and places. The cue is the part that drives follow-through, so it is
    # attached per requirement rather than to the goal as a whole.
    requirements:
      - id: short
        label: "20-30 min session"
        sessions_per_period: 3
        implementation_intention:
          when: "after lunch, or as soon as I get home from work"
          where: "the office gym or at home"
      - id: long
        label: "2 hour session"
        sessions_per_period: 1
        by_day: Wed          # it is a club session early in the week, so it
        implementation_intention:   # cannot be pushed to the weekend
          when: "6-8pm"
          where: "the boxing club"

    # The if-then line appears only when both of these are set, so the obstacle
    # sits here on its own until a coping plan is chosen.
    obstacle: "looking after your kid or an unexpected task takes the slot"

    nudge:
      at: "17:00"
      cadence: risk_only   # only on the kickoff day, or once a skip would
      kickoff_on: Mon      # make the week impossible

    # Eight weeks, judged on how many weeks fell short. Tiers must ascend, and
    # the first one whose limit still holds is what remains achievable.
    block:
      periods: 8
      starts: 2026-08-17
      tiers:
        - max_missed: 0
          outcome: "Buy the $100 earphones"
        - max_missed: 1
          outcome: "Buy the $60 earphones"
        - max_missed: 3
          outcome: "Buy the $30 earphones"
      otherwise: "Take all Seamus night shifts for one week"
